<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>第八課遊戲</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: 'Noto Sans TC', 'PingFang HK', sans-serif;
      background: #F7F3EB;
      color: #2c3e50;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }

    .hero {
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid #f0e6d8;
      margin-bottom: 20px;
    }
    .hero-body {
      padding: 22px 20px 24px;
      text-align: center;
    }
    .hero-body h1 {
      font-size: 1.7rem;
      font-weight: 900;
      color: #1a4a6e;
      margin-bottom: 6px;
    }
    .hero-body p {
      font-size: 1rem;
      color: #5a6a7a;
      line-height: 1.55;
      margin-bottom: 4px;
    }
    .back {
      display: inline-block;
      margin-top: 10px;
      color: #1a6b8a;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a4a6e;
      margin: 8px 0 12px;
      text-align: center;
    }

    .game-list { display: flex; flex-direction: column; gap: 12px; }

    .game-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px 16px;
      border: 1px solid #f0eae0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .game-card:active { transform: scale(0.98); }
    .game-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }
    .game-info { flex: 1; min-width: 0; }
    .game-info h3 {
      font-size: 1.1rem;
      color: #1a4a6e;
      margin-bottom: 4px;
    }
    .game-info p {
      font-size: 0.88rem;
      color: #6a7a8a;
      line-height: 1.4;
    }
    .game-arrow {
      font-size: 1.3rem;
      color: #1a6b8a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-body">
        <h1>第八課遊戲</h1>
        <p>忍者詞卡 · 晨間忍術 · 寫字搶星 · 森林練功 · 語文大冒險</p>
        <a class="back" href="../">← 返回主頁</a>
      </div>
    </div>

    <div class="section-title">選擇遊戲</div>

    <div class="game-list">
      <a class="game-card" href="../naruto-ch8/">
        <div class="game-icon" style="background:#fff1e6;">🎴</div>
        <div class="game-info">
          <h3>忍者詞卡大冒險</h3>
          <p>查克拉組詞</p>
        </div>
        <div class="game-arrow">→</div>
      </a>

      <a class="game-card" href="../morning-ch8/">
        <div class="game-icon" style="background:#fff7ed;">🌅</div>
        <div class="game-info">
          <h3>晨間忍術</h3>
          <p>五詞出招 · 翻牌砌詞 · 畫氣</p>
        </div>
        <div class="game-arrow">→</div>
      </a>

      <a class="game-card" href="../write-star-aid/">
        <div class="game-icon" style="background:#fff7d6;">⭐</div>
        <div class="game-info">
          <h3>寫字搶星 · 忍具援助</h3>
          <p>五詞限時畫氣 · 幫忍者換裝備</p>
        </div>
        <div class="game-arrow">→</div>
      </a>

      <a class="game-card" href="../forest-balloon/">
        <div class="game-icon" style="background:#e8f5e9;">🎈</div>
        <div class="game-info">
          <h3>森林練功 · 飛鏢氣球</h3>
          <p>聽詞 · 飛鏢氣球 · 出招畫氣</p>
        </div>
        <div class="game-arrow">→</div>
      </a>

      <a class="game-card" href="https://wordwall.net/resource/122128086?wwmethod=link" target="_blank" rel="noopener">
        <div class="game-icon" style="background:#e8f4ff;">🌀</div>
        <div class="game-info">
          <h3>語文大冒險</h3>
          <p>迷宮追擊</p>
        </div>
        <div class="game-arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
