<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>森林練功 · 飛鏢氣球</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans TC','PingFang HK','Microsoft JhengHei',sans-serif;
  color:#1a3a2a;
  background:#0d2a18;
  min-height:100vh;
  min-height:100dvh;
}
.screen{display:none;position:fixed;inset:0;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* Forest background layers */
.forest-bg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #4a9e5f 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 10% 90%, #1a5c32 0%, transparent 50%),
    radial-gradient(ellipse 70% 45% at 90% 85%, #164a28 0%, transparent 50%),
    linear-gradient(180deg, #87CEEB 0%, #6bb8e8 18%, #4a9e5f 42%, #2d6b3a 70%, #1a3a22 100%);
}
.forest-bg::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:28%;
  background:
    radial-gradient(ellipse 40% 100% at 8% 100%, #0f2e18 0%, transparent 70%),
    radial-gradient(ellipse 35% 90% at 28% 100%, #143820 0%, transparent 65%),
    radial-gradient(ellipse 45% 110% at 52% 100%, #0d2814 0%, transparent 70%),
    radial-gradient(ellipse 38% 95% at 75% 100%, #12351c 0%, transparent 65%),
    radial-gradient(ellipse 42% 100% at 95% 100%, #0f2e18 0%, transparent 70%);
}
.forest-bg::after{
  content:'🌳 🌲 🌿';position:absolute;left:0;right:0;bottom:2%;
  text-align:center;font-size:clamp(1.6rem,5vw,2.8rem);letter-spacing:.6em;
  opacity:.55;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
}

.ui{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;padding:12px 14px 18px;max-width:900px;width:100%;margin:0 auto;pointer-events:none}
.ui > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.5);
  border-radius:999px;padding:7px 14px;font-weight:800;font-size:.95rem;
  box-shadow:0 2px 10px rgba(0,0,0,.12);color:#1a3a2a;
}
h1{font-size:clamp(1.55rem,5.5vw,2.2rem);font-weight:900;line-height:1.25;margin:10px 0 6px;text-align:center;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45),0 0 30px rgba(255,200,80,.25)}
h1 span{color:#ffe566}
.sub{text-align:center;color:rgba(255,255,255,.9);line-height:1.5;margin-bottom:14px;font-weight:700;
  text-shadow:0 1px 6px rgba(0,0,0,.35);font-size:clamp(.95rem,3vw,1.1rem)}
.btn{
  display:block;width:100%;border:none;border-radius:18px;padding:16px 18px;
  font-size:1.2rem;font-weight:900;font-family:inherit;cursor:pointer;margin:8px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.22);transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn-main{background:linear-gradient(135deg,#1a6b8a,#0d4a66);color:#fff}
.btn-orange{background:linear-gradient(135deg,#ff6b00,#ffd700);color:#1a1a2e}
.btn-ghost{background:rgba(255,255,255,.92);border:2px solid #c5d4e0;color:#1a4a6e;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#86efac);color:#052e16}
.btn-sm{width:auto;padding:10px 14px;font-size:1rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:120px}
.hint{
  background:rgba(255,247,237,.95);border-left:5px solid #e65c00;
  padding:12px 14px;border-radius:12px;margin:8px 0;font-weight:800;
  color:#1a3a2a;font-size:clamp(1rem,3.5vw,1.2rem);
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}
.cover-art{text-align:center;font-size:clamp(4rem,18vw,7rem);margin:12px 0 8px;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));line-height:1.1}
.cover-ninja{font-size:clamp(2.5rem,10vw,4rem);margin-top:-8px;opacity:.95}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

/* Listen / balloon playfield */
#balloonField{
  position:relative;flex:1;min-height:220px;margin:6px 0;border-radius:20px;
  overflow:hidden;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);
  touch-action:none;
}
.balloon{
  position:absolute;width:clamp(88px,22vw,120px);height:clamp(110px,28vw,150px);
  border:none;background:transparent;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  font-family:inherit;z-index:3;transform:translate(-50%,0);
  animation:floatY 2.4s ease-in-out infinite;
}
.balloon .blob{
  width:100%;aspect-ratio:5/6;border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.05rem,3.8vw,1.45rem);font-weight:900;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.35);padding:8px 6px;line-height:1.15;text-align:center;
  box-shadow:inset -8px -12px 20px rgba(0,0,0,.18), inset 6px 8px 16px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.25);
  position:relative;
}
.balloon .blob::after{
  content:'';position:absolute;bottom:-10px;left:50%;width:3px;height:18px;
  background:rgba(255,255,255,.55);transform:translateX(-50%);border-radius:2px;
}
.balloon .knot{
  width:12px;height:10px;background:inherit;margin-top:-2px;
  clip-path:polygon(50% 100%,0 0,100% 0);opacity:.85;
}
.balloon.b0 .blob{background:linear-gradient(145deg,#ff6b6b,#e63946)}
.balloon.b1 .blob{background:linear-gradient(145deg,#4ecdc4,#1a9e96)}
.balloon.b2 .blob{background:linear-gradient(145deg,#ffe66d,#f4a261)}
.balloon.b3 .blob{background:linear-gradient(145deg,#a78bfa,#7c3aed)}
.balloon.b4 .blob{background:linear-gradient(145deg,#60a5fa,#2563eb)}
.balloon.shake{animation:shake .4s}
.balloon.pop{animation:popBalloon .35s forwards;pointer-events:none}
@keyframes floatY{0%,100%{margin-top:0}50%{margin-top:-6px}}
@keyframes shake{0%,100%{transform:translate(-50%,0)}25%{transform:translate(calc(-50% - 10px),0)}75%{transform:translate(calc(-50% + 10px),0)}}
@keyframes popBalloon{0%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-20px) scale(1.4);opacity:0}}

/* Dart line */
.dart-line{
  position:absolute;height:3px;background:linear-gradient(90deg,transparent,#ffd700 20%,#fff 50%,#ff6b00);
  transform-origin:left center;pointer-events:none;z-index:20;border-radius:2px;
  box-shadow:0 0 8px #ffd700;opacity:0;
}
.dart-line.fly{animation:dartFly .28s ease-out forwards}
@keyframes dartFly{0%{opacity:1;transform:scaleX(0)}70%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}

/* Reward overlay */
.reward{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(8,28,18,.9);align-items:center;justify-content:center;
  flex-direction:column;color:#fff;text-align:center;padding:24px;
}
.reward.on{display:flex}
.reward .big{font-size:5rem;line-height:1;margin-bottom:8px;animation:pop .45s ease}
.reward .ttl{font-size:clamp(2rem,8vw,2.8rem);font-weight:900;margin:8px 0;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.reward .subr{font-size:1.25rem;font-weight:800;opacity:.95;margin-top:6px;color:#ffe566}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* Write canvas — transparent so 淡字氣影 shows through */
.canvas-wrap{
  background:
    repeating-linear-gradient(transparent,transparent 69px,rgba(241,232,220,.55) 69px,rgba(241,232,220,.55) 70px),
    rgba(255,252,245,.55);
  border:3px solid #d4a017;border-radius:18px;overflow:hidden;
  touch-action:none;position:relative;flex:1;min-height:240px;margin:8px 0;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}
#writeCanvas{width:100%;height:100%;display:block;min-height:240px;
  background:transparent;position:relative;z-index:1}
.write-model{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:clamp(2.4rem,12vw,5rem);font-weight:900;color:rgba(26,74,110,.28);
  pointer-events:none;letter-spacing:.08em;z-index:0;padding:12px;
}
.write-model .swirl{font-size:clamp(1.4rem,6vw,2.2rem);opacity:.7;margin-left:4px;color:rgba(230,92,0,.45)}
#fbWrite{min-height:24px;text-align:center;font-weight:800;margin:4px 0;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}

/* Shop */
.shop-card{
  background:rgba(255,255,255,.95);border:2px solid #f0e6d8;border-radius:18px;
  padding:18px;text-align:center;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.12);
}
.shop-card .ico{font-size:3rem;margin:4px 0}
.shop-card .nm{font-weight:900;font-size:1.25rem;margin:6px 0;color:#1a3a2a}
.shop-card .lv{font-weight:800;color:#64748b;margin-bottom:10px}
.shop-msg{text-align:center;font-weight:900;min-height:28px;margin:8px 0;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.shop-msg.err{color:#fecaca}

/* Celebration */
.cele{text-align:center}
.cele .emoji{font-size:clamp(3.5rem,14vw,5.5rem);margin:10px 0;animation:pop .5s ease}
.prog-dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.prog-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}
.prog-dots span.on{background:#ffe566;box-shadow:0 0 8px #ffd700}

.speaker-btn{
  width:56px;height:56px;border-radius:50%;border:3px solid #ffd700;
  background:linear-gradient(135deg,#1a6b8a,#0d4a66);color:#fff;font-size:1.6rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);flex-shrink:0;
}
.speaker-btn:active{transform:scale(.94)}
.listen-row{display:flex;align-items:center;gap:12px;margin:4px 0}

.teacher{
  margin:10px 4px 0;padding:10px 12px;background:rgba(248,250,252,.85);
  border:1px dashed #94a3b8;border-radius:12px;font-size:.72rem;color:#64748b;line-height:1.5;
  pointer-events:none;
}
</style>
</head>
<body>

<!-- COVER -->
<div class="screen active" id="sc-cover">
  <div class="forest-bg"></div>
  <div class="ui">
    <div class="top">
      <div class="pill" id="coverStars">⭐ 0</div>
      <div class="pill" id="coverShuriken">手裏劍 Lv.1</div>
    </div>
    <div class="grow">
      <div class="cover-art">🎈<br><span class="cover-ninja">🥷</span></div>
      <h1>森林練功<br><span>· 飛鏢氣球</span></h1>
      <p class="sub">聽詞 → 射氣球 → 出招畫氣 → 收集查克拉星</p>
      <button class="btn btn-orange" id="btnStart">開始練功</button>
      <button class="btn btn-ghost" id="btnCoverShop">忍具店</button>
    </div>
    <div class="teacher">老師用 · v0.1.1 森林練功·飛鏢氣球 · 9詞 · 存檔 forestBalloon_v01 · 學生介面禁溫習／默寫／練習／複習</div>
  </div>
</div>

<!-- LISTEN + BALLOONS -->
<div class="screen" id="sc-play">
  <div class="forest-bg"></div>
  <div class="ui" style="padding-bottom:10px">
    <div class="top">
      <button class="btn btn-ghost btn-sm" id="playBack">← 返回</button>
      <div class="pill" id="playProg">1 / 9</div>
      <div class="pill" id="playStars">⭐ 0</div>
    </div>
    <div class="listen-row">
      <div class="hint" style="flex:1;margin:0">聽一聽，射中正確氣球！</div>
      <button class="speaker-btn" id="btnSpeak" type="button" aria-label="再聽一次">🔊</button>
    </div>
    <div class="prog-dots" id="progDots"></div>
    <div id="balloonField">
      <div class="dart-line" id="dartLine"></div>
    </div>
  </div>
</div>

<!-- WRITE -->
<div class="screen" id="sc-write">
  <div class="forest-bg"></div>
  <div class="ui">
    <div class="top">
      <div class="pill">出招畫氣</div>
      <div class="pill" id="writeStars">⭐ 0</div>
    </div>
    <div class="hint" id="writeHint">用手指沿著淡字畫氣出招！</div>
    <div class="canvas-wrap">
      <div class="write-model" id="writeModel"></div>
      <canvas id="writeCanvas" width="720" height="320"></canvas>
    </div>
    <div id="fbWrite"></div>
    <div class="row">
      <button class="btn btn-ghost" id="btnClear">清空</button>
      <button class="btn btn-orange" id="btnFinishWrite">完成</button>
    </div>
  </div>
</div>

<!-- SHOP -->
<div class="screen" id="sc-shop">
  <div class="forest-bg"></div>
  <div class="ui">
    <div class="top">
      <button class="btn btn-ghost btn-sm" id="shopBack">← 返回</button>
      <div class="pill" id="shopStars">⭐ 0</div>
    </div>
    <h1 style="font-size:1.5rem">忍具店</h1>
    <p class="sub">用查克拉星升級手裏劍</p>
    <div class="shop-card">
      <div class="ico" id="shopIco">✶</div>
      <div class="nm">手裏劍</div>
      <div class="lv" id="shopLv">目前等級：1</div>
      <button class="btn btn-main" id="btnUpgrade">升級手裏劍</button>
    </div>
    <div class="shop-msg" id="shopMsg"></div>
    <p class="sub" style="font-size:.9rem" id="shopCostHint">下一級需要 ⭐ 4</p>
  </div>
</div>

<!-- CELEBRATION -->
<div class="screen" id="sc-done">
  <div class="forest-bg"></div>
  <div class="ui">
    <div class="grow cele">
      <div class="emoji">🎉🥷🎈</div>
      <h1>全部命中！</h1>
      <p class="sub" id="doneSub">查克拉星大增！去忍具店升級手裏劍吧！</p>
      <div class="pill" id="doneStars" style="display:inline-block;margin:8px auto;font-size:1.15rem">⭐ 0</div>
      <button class="btn btn-orange" id="btnDoneShop">忍具店</button>
      <button class="btn btn-ghost" id="btnReplay">再來一輪</button>
      <button class="btn btn-main" id="btnDoneHome">返回封面</button>
    </div>
  </div>
</div>

<div class="reward" id="reward">
  <div class="big" id="rewardBig">🎯</div>
  <div class="ttl" id="rewardTitle">命中！</div>
  <div class="subr" id="rewardSub">查克拉星＋2</div>
</div>

<script>
(function(){
'use strict';

const WORDS = ['打滾','手術','一位','團團轉','鏡子','成功','救','暗','醫生'];
const HIT_STARS = 2;
const WRITE_STARS = 3;
const SHURIKEN_COSTS = [0, 4, 7]; // cost to reach level 1→2, 2→3 (index = target level-1 unused; use level as index for next)
const SAVE_STARS = 'forestBalloon_v01_stars';
const SAVE_SHURIKEN = 'forestBalloon_v01_shuriken';
const SAVE_META = 'forestBalloon_v01_meta';

const COLORS = ['b0','b1','b2','b3','b4'];

let stars = 0;
let shuriken = 1;
let order = [];
let idx = 0;
let target = '';
let balloons = [];
let animId = null;
let lockTap = false;
let rewardTimer = null;
let shopReturn = 'sc-cover';
let drawing = false;
let strokes = 0;

function load(){
  try{
    stars = parseInt(localStorage.getItem(SAVE_STARS)||'0',10)||0;
    shuriken = parseInt(localStorage.getItem(SAVE_SHURIKEN)||'1',10)||1;
    if(shuriken<1) shuriken=1;
    if(shuriken>3) shuriken=3;
  }catch(e){ stars=0; shuriken=1; }
}
function save(){
  try{
    localStorage.setItem(SAVE_STARS, String(stars));
    localStorage.setItem(SAVE_SHURIKEN, String(shuriken));
  }catch(e){}
}
function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updatePills();
}
function updatePills(){
  const s='⭐ '+stars;
  ['coverStars','playStars','writeStars','shopStars','doneStars'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.textContent=s;
  });
  const sh='手裏劍 Lv.'+shuriken;
  const cs=document.getElementById('coverShuriken');
  if(cs) cs.textContent=sh;
  const sl=document.getElementById('shopLv');
  if(sl) sl.textContent='目前等級：'+shuriken;
  const ico=document.getElementById('shopIco');
  if(ico) ico.textContent = shuriken===1?'✶':(shuriken===2?'✦':'★');
  const costHint=document.getElementById('shopCostHint');
  const btnUp=document.getElementById('btnUpgrade');
  if(shuriken>=3){
    if(costHint) costHint.textContent='手裏劍已達最高等級！';
    if(btnUp){ btnUp.disabled=true; btnUp.textContent='已滿級'; }
  } else {
    const cost = shuriken===1 ? 4 : 7;
    if(costHint) costHint.textContent='下一級需要 ⭐ '+cost;
    if(btnUp){ btnUp.disabled=false; btnUp.textContent='升級手裏劍'; }
  }
}

function speak(t){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    const voices=speechSynthesis.getVoices()||[];
    const pref=voices.find(v=>/zh[-_]HK/i.test(v.lang))
      || voices.find(v=>/zh[-_]TW/i.test(v.lang))
      || voices.find(v=>/zh/i.test(v.lang));
    if(pref) u.voice=pref;
    u.lang = pref ? pref.lang : 'zh-HK';
    u.rate=0.88;
    speechSynthesis.speak(u);
  }catch(e){}
}
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); };
}

function showReward(big, title, sub, ms, then){
  const el=document.getElementById('reward');
  document.getElementById('rewardBig').textContent=big;
  document.getElementById('rewardTitle').textContent=title;
  document.getElementById('rewardSub').textContent=sub||'';
  el.classList.add('on');
  if(rewardTimer) clearTimeout(rewardTimer);
  rewardTimer=setTimeout(()=>{
    el.classList.remove('on');
    if(then) then();
  }, ms);
}

function renderDots(){
  const box=document.getElementById('progDots');
  box.innerHTML=order.map((_,i)=>'<span class="'+(i<idx?'on':'')+'"></span>').join('');
}

function startRound(){
  order=shuffle(WORDS);
  idx=0;
  startListen();
}

function startListen(){
  if(idx>=order.length){
    stopBalloons();
    document.getElementById('doneSub').textContent='共獲得查克拉星！去忍具店升級手裏劍吧！';
    show('sc-done');
    return;
  }
  target=order[idx];
  lockTap=false;
  document.getElementById('playProg').textContent=(idx+1)+' / '+order.length;
  renderDots();
  show('sc-play');
  spawnBalloons();
  setTimeout(()=>speak(target), 280);
}

function distractorsFor(word){
  const pool=WORDS.filter(w=>w!==word);
  const n = Math.random()<0.5 ? 2 : 3;
  return shuffle(pool).slice(0,n);
}

function spawnBalloons(){
  stopBalloons();
  const field=document.getElementById('balloonField');
  field.querySelectorAll('.balloon').forEach(b=>b.remove());
  const dist=distractorsFor(target);
  const labels=shuffle([target, ...dist]);
  const W=field.clientWidth||300;
  const H=field.clientHeight||280;
  balloons=[];
  const slots=labels.length;
  labels.forEach((lab,i)=>{
    const el=document.createElement('button');
    el.type='button';
    el.className='balloon '+COLORS[i%COLORS.length];
    el.innerHTML='<div class="blob">'+lab+'</div>';
    const xPad=W*0.12;
    const x=xPad + (W-2*xPad)*(i+0.5)/slots + (Math.random()*16-8);
    const y= -40 - Math.random()*80 - i*20;
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.dataset.word=lab;
    el.dataset.correct=lab===target?'1':'0';
    el.addEventListener('pointerdown', onBalloonTap, {passive:false});
    field.appendChild(el);
    const speed = 0.55 + Math.random()*0.45 + (shuriken-1)*0.08;
    balloons.push({el, x, y, speed, wobble:Math.random()*Math.PI*2, wobAmp:8+Math.random()*10});
  });
  animId=requestAnimationFrame(tickBalloons);
}

function stopBalloons(){
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  balloons=[];
}

function tickBalloons(){
  const field=document.getElementById('balloonField');
  if(!field || !document.getElementById('sc-play').classList.contains('active')){
    animId=null; return;
  }
  const H=field.clientHeight||280;
  const W=field.clientWidth||300;
  balloons.forEach(b=>{
    if(!b.el.parentNode) return;
    b.y += b.speed;
    b.wobble += 0.03;
    const wx = b.x + Math.sin(b.wobble)*b.wobAmp;
    if(b.y > H+40){
      b.y = -100 - Math.random()*60;
      b.x = W*0.12 + Math.random()*W*0.76;
    }
    b.el.style.left = wx+'px';
    b.el.style.top = b.y+'px';
  });
  animId=requestAnimationFrame(tickBalloons);
}

function onBalloonTap(e){
  e.preventDefault();
  e.stopPropagation();
  if(lockTap) return;
  const el=e.currentTarget;
  const ok=el.dataset.correct==='1';
  if(ok){
    lockTap=true;
    fireDart(el);
    el.classList.add('pop');
    stars += HIT_STARS;
    save();
    updatePills();
    setTimeout(()=>{
      stopBalloons();
      showReward('🎯','命中！','查克拉星＋'+HIT_STARS, 900, ()=>{
        startWrite();
      });
    }, 280);
  } else {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 400);
  }
}

function fireDart(targetEl){
  const field=document.getElementById('balloonField');
  const dart=document.getElementById('dartLine');
  const fr=field.getBoundingClientRect();
  const tr=targetEl.getBoundingClientRect();
  const x0=fr.width*0.5;
  const y0=fr.height-8;
  const x1=(tr.left+tr.right)/2 - fr.left;
  const y1=(tr.top+tr.bottom)/2 - fr.top;
  const dx=x1-x0, dy=y1-y0;
  const len=Math.sqrt(dx*dx+dy*dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  dart.style.left=x0+'px';
  dart.style.top=y0+'px';
  dart.style.width=len+'px';
  dart.style.transform='rotate('+ang+'deg)';
  dart.classList.remove('fly');
  void dart.offsetWidth;
  dart.classList.add('fly');
}

function startWrite(){
  strokes=0;
  document.getElementById('fbWrite').textContent='';
  document.getElementById('writeHint').textContent='用手指沿著淡字畫氣出招！';
  const model=document.getElementById('writeModel');
  if(target==='團團轉'){
    model.innerHTML='<span>團團轉</span><span class="swirl" aria-hidden="true">🌀</span>';
  } else {
    model.textContent=target;
  }
  show('sc-write');
  clearCanvas();
  resizeCanvas();
}

const canvas=document.getElementById('writeCanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
  const wrap=canvas.parentElement;
  const r=wrap.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(280, Math.floor(r.width));
  const h=Math.max(240, Math.floor(r.height));
  canvas.width=Math.floor(w*dpr);
  canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.strokeStyle='#e65c00';
  ctx.lineWidth=Math.max(4, Math.min(7, w/100));
}
function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function clearCanvas(){
  strokes=0;
  const r=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width||720,r.height||320);
}
function startDraw(e){ e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
function moveDraw(e){ if(!drawing)return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); strokes++; }
function endDraw(){ drawing=false; }
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw);

function finishWrite(){
  if(strokes<6){
    document.getElementById('fbWrite').textContent='再畫清楚一點！';
    document.getElementById('fbWrite').style.color='#fecaca';
    return;
  }
  stars += WRITE_STARS;
  save();
  updatePills();
  showReward('⭐','出招成功！','查克拉星＋'+WRITE_STARS, 1000, ()=>{
    idx++;
    if(idx>=order.length){
      document.getElementById('doneSub').textContent='九詞全部命中！去忍具店升級手裏劍吧！';
      show('sc-done');
    } else {
      startListen();
    }
  });
}

function openShop(from){
  shopReturn=from||'sc-cover';
  document.getElementById('shopMsg').textContent='';
  document.getElementById('shopMsg').classList.remove('err');
  updatePills();
  show('sc-shop');
}

function upgradeShuriken(){
  const msg=document.getElementById('shopMsg');
  msg.classList.remove('err');
  if(shuriken>=3){
    msg.textContent='手裏劍已達最高等級！';
    return;
  }
  const cost = shuriken===1 ? 4 : 7;
  if(stars < cost){
    msg.textContent='忍幣不足';
    msg.classList.add('err');
    return;
  }
  stars -= cost;
  shuriken += 1;
  save();
  updatePills();
  msg.textContent='手裏劍升級成功！Lv.'+shuriken;
}

/* Wire UI */
document.getElementById('btnStart').onclick=()=>startRound();
document.getElementById('btnCoverShop').onclick=()=>openShop('sc-cover');
document.getElementById('playBack').onclick=()=>{
  stopBalloons();
  if(window.speechSynthesis) try{speechSynthesis.cancel();}catch(e){}
  show('sc-cover');
};
document.getElementById('btnSpeak').onclick=()=>speak(target);
document.getElementById('btnClear').onclick=clearCanvas;
document.getElementById('btnFinishWrite').onclick=finishWrite;
document.getElementById('shopBack').onclick=()=>show(shopReturn);
document.getElementById('btnUpgrade').onclick=upgradeShuriken;
document.getElementById('btnDoneShop').onclick=()=>openShop('sc-done');
document.getElementById('btnReplay').onclick=()=>startRound();
document.getElementById('btnDoneHome').onclick=()=>show('sc-cover');

window.addEventListener('resize', ()=>{
  if(document.getElementById('sc-write').classList.contains('active')) resizeCanvas();
});

load();
updatePills();
})();
</script>
